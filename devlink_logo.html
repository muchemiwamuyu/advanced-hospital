<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLink - Interactive Logo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        .logo-container {
            position: relative;
            width: 400px;
            height: 400px;
            transform-style: preserve-3d;
            animation: floatRotate 8s ease-in-out infinite;
        }

        .main-frame {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-radius: 20px;
            background: linear-gradient(45deg, #00d4aa, #0066ff, #8a2be2, #ff6b6b) border-box;
            background-clip: padding-box;
            transform-style: preserve-3d;
            animation: frameRotate 6s linear infinite;
        }

        .inner-frame {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            transform: translateZ(20px);
        }

        .logo-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(40px);
            color: #fff;
            font-size: 3.5rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 212, 170, 0.5);
            animation: textGlow 3s ease-in-out infinite alternate;
        }

        .dev-text {
            background: linear-gradient(45deg, #00d4aa, #0066ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .link-text {
            background: linear-gradient(45deg, #ff6b6b, #8a2be2);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .floating-element {
            position: absolute;
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #00d4aa, #0066ff);
            border-radius: 50%;
            animation: float 4s ease-in-out infinite;
            opacity: 0.8;
        }

        .floating-element:nth-child(1) {
            top: 10%;
            left: 20%;
            animation-delay: 0s;
            transform: translateZ(60px);
        }

        .floating-element:nth-child(2) {
            top: 20%;
            right: 10%;
            animation-delay: 1s;
            transform: translateZ(80px);
        }

        .floating-element:nth-child(3) {
            bottom: 30%;
            left: 10%;
            animation-delay: 2s;
            transform: translateZ(100px);
        }

        .floating-element:nth-child(4) {
            bottom: 10%;
            right: 20%;
            animation-delay: 3s;
            transform: translateZ(120px);
        }

        .connection-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: translateZ(30px);
        }

        .line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #00d4aa, transparent);
            height: 2px;
            opacity: 0.6;
            animation: lineMove 3s ease-in-out infinite;
        }

        .line1 {
            top: 25%;
            left: 15%;
            width: 70%;
            animation-delay: 0s;
        }

        .line2 {
            top: 75%;
            left: 15%;
            width: 70%;
            animation-delay: 1.5s;
        }

        .vertical-line {
            position: absolute;
            background: linear-gradient(0deg, transparent, #0066ff, transparent);
            width: 2px;
            opacity: 0.6;
            animation: lineMove 3s ease-in-out infinite;
        }

        .vline1 {
            left: 25%;
            top: 15%;
            height: 70%;
            animation-delay: 0.75s;
        }

        .vline2 {
            right: 25%;
            top: 15%;
            height: 70%;
            animation-delay: 2.25s;
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00d4aa;
            border-radius: 50%;
            animation: particleFloat 6s linear infinite;
            opacity: 0;
        }

        /* Animations */
        @keyframes floatRotate {
            0%, 100% { transform: rotateY(0deg) rotateX(5deg) translateY(0px); }
            25% { transform: rotateY(90deg) rotateX(10deg) translateY(-10px); }
            50% { transform: rotateY(180deg) rotateX(5deg) translateY(0px); }
            75% { transform: rotateY(270deg) rotateX(10deg) translateY(-10px); }
        }

        @keyframes frameRotate {
            from { transform: rotateZ(0deg); }
            to { transform: rotateZ(360deg); }
        }

        @keyframes textGlow {
            0% { text-shadow: 0 0 20px rgba(0, 212, 170, 0.5); }
            100% { text-shadow: 0 0 30px rgba(0, 212, 170, 0.8), 0 0 40px rgba(0, 102, 255, 0.4); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateZ(var(--z)) rotateY(0deg); }
            50% { transform: translateY(-20px) translateZ(var(--z)) rotateY(180deg); }
        }

        @keyframes lineMove {
            0%, 100% { opacity: 0.6; transform: translateX(0px); }
            50% { opacity: 1; transform: translateX(10px); }
        }

        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(100vh) translateX(0px); }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100vh) translateX(100px); }
        }

        /* Hover effects */
        .logo-container:hover {
            animation-play-state: paused;
            transform: rotateY(20deg) rotateX(10deg) scale(1.1);
            transition: transform 0.3s ease;
        }

        .logo-container:hover .logo-text {
            animation-duration: 1s;
        }

        .logo-container:hover .floating-element {
            animation-duration: 2s;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .logo-container {
                width: 300px;
                height: 300px;
            }
            
            .logo-text {
                font-size: 2.5rem;
            }
        }

        /* Interactive particles */
        .interactive-area {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="interactive-area" id="interactiveArea"></div>
    
    <div class="logo-container" id="logoContainer">
        <div class="main-frame">
            <div class="inner-frame"></div>
        </div>
        
        <div class="logo-text">
            <span class="dev-text">dev</span><span class="link-text">link</span>
        </div>
        
        <div class="floating-elements">
            <div class="floating-element" style="--z: 60px;"></div>
            <div class="floating-element" style="--z: 80px;"></div>
            <div class="floating-element" style="--z: 100px;"></div>
            <div class="floating-element" style="--z: 120px;"></div>
        </div>
        
        <div class="connection-lines">
            <div class="line line1"></div>
            <div class="line line2"></div>
            <div class="vertical-line vline1"></div>
            <div class="vertical-line vline2"></div>
        </div>
        
        <div class="particles" id="particles"></div>
    </div>

    <script>
        // Interactive mouse tracking
        document.addEventListener('mousemove', (e) => {
            const logoContainer = document.getElementById('logoContainer');
            const rect = logoContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const deltaX = (e.clientX - centerX) / window.innerWidth;
            const deltaY = (e.clientY - centerY) / window.innerHeight;
            
            logoContainer.style.transform = `
                rotateY(${deltaX * 30}deg) 
                rotateX(${-deltaY * 30}deg) 
                translateZ(0px)
            `;
        });

        // Create interactive particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Click interaction
        document.getElementById('logoContainer').addEventListener('click', () => {
            const logoContainer = document.getElementById('logoContainer');
            logoContainer.style.animation = 'none';
            logoContainer.style.transform = 'rotateY(720deg) rotateX(360deg) scale(1.2)';
            logoContainer.style.transition = 'transform 2s ease';
            
            setTimeout(() => {
                logoContainer.style.animation = 'floatRotate 8s ease-in-out infinite';
                logoContainer.style.transform = '';
                logoContainer.style.transition = '';
            }, 2000);
        });

        // Initialize
        createParticles();

        // Add ripple effect on click
        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.style.position = 'fixed';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            ripple.style.width = '20px';
            ripple.style.height = '20px';
            ripple.style.borderRadius = '50%';
            ripple.style.background = 'radial-gradient(circle, rgba(0,212,170,0.6) 0%, transparent 70%)';
            ripple.style.transform = 'translate(-50%, -50%)';
            ripple.style.pointerEvents = 'none';
            ripple.style.animation = 'ripple 1s ease-out forwards';
            ripple.style.zIndex = '1000';
            
            document.body.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 1000);
        });

        // Add ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    width: 100px;
                    height: 100px;
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Keyboard interactions
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                const elements = document.querySelectorAll('.floating-element');
                elements.forEach((el, index) => {
                    el.style.animationDelay = (index * 0.2) + 's';
                    el.style.animationDuration = '1s';
                });
                
                setTimeout(() => {
                    elements.forEach(el => {
                        el.style.animationDuration = '4s';
                    });
                }, 2000);
            }
        });
    </script>
</body>
</html>
